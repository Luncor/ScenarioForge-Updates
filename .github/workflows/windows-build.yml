name: Scenario Forge - Public Windows x64 Build and Release

on:
  repository_dispatch:
    types:
      - scenarioforge_build
  workflow_dispatch:
    inputs:
      source_sha:
        description: "40-character commit SHA from Luncor/ScenarioForge"
        required: true
        type: string
      publish_release:
        description: "Publish a GitHub Release after the build (leave off for a safe build-only test)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: scenario-forge-public-windows-${{ github.event.client_payload.source_sha || inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      publish_release: ${{ steps.source.outputs.publish_release }}
    steps:
      - name: Validate the requested private source commit
        id: source
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          EVENT_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'repository_dispatch') {
            if ($env:SOURCE_REPOSITORY -ne 'Luncor/ScenarioForge') {
              throw "Unexpected source repository: $($env:SOURCE_REPOSITORY)"
            }
            if ($env:SOURCE_REF -ne 'main') {
              throw "Only the private main branch may be released. Received: $($env:SOURCE_REF)"
            }
            $sha = $env:EVENT_SOURCE_SHA
            $publish = 'true'
          } else {
            $sha = $env:INPUT_SOURCE_SHA
            $publish = if ($env:INPUT_PUBLISH_RELEASE -eq 'true') { 'true' } else { 'false' }
          }

          if ([string]::IsNullOrWhiteSpace($sha) -or $sha -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'A valid 40-character source commit SHA is required.'
          }

          $sha = $sha.ToLowerInvariant()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish_release=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Source: Luncor/ScenarioForge@$sha"
          Write-Host "Publish release: $publish"

      - name: Checkout private Scenario Forge source
        uses: actions/checkout@v4
        with:
          repository: Luncor/ScenarioForge
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build the Turkish Ahenk Cep helper
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --manifest-path tools/TurkishTts/Cargo.toml --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Turkish speech helper build failed with exit code $LASTEXITCODE." }

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed (exit code $LASTEXITCODE)." }
          }
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($isccCommand) {
            Write-Host "Inno Setup compiler: $($isccCommand.Source)"
          } elseif ($iscc) {
            Write-Host "Inno Setup compiler: $iscc"
          } else {
            $iscc = Get-ChildItem -Path "C:\Program Files (x86)" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          }

      - name: Confirm pinned .NET SDK
        shell: pwsh
        run: |
          $sdk = dotnet --version
          Write-Host "Selected SDK: $sdk"
          if (-not $sdk.StartsWith('10.')) { throw "Expected .NET 10 SDK from global.json, got $sdk." }

      - name: Restore and publish application
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./Build-Windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build-Windows.ps1 failed with exit code $LASTEXITCODE." }

      - name: Verify installer and application payload
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Resolve-Path ./dist/App/ScenarioForge.exe -ErrorAction Stop
          $installer = Get-ChildItem ./dist/Installer/ScenarioForge-Setup-*.exe -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "The Setup.exe package was not created." }
          $nativeRoot = Resolve-Path ./dist/App/runtimes/win-x64/native -ErrorAction Stop
          $vulkanLlama = Join-Path $nativeRoot 'vulkan/llama.dll'
          $vulkanBackend = Join-Path $nativeRoot 'vulkan/ggml-vulkan.dll'
          $onnxRuntime = Join-Path $nativeRoot 'onnxruntime.dll'
          if (-not (Test-Path $vulkanLlama)) { throw "Missing Vulkan LLama backend: $vulkanLlama" }
          if (-not (Test-Path $vulkanBackend)) { throw "Missing Vulkan compute backend: $vulkanBackend" }
          if (-not (Test-Path $onnxRuntime)) { throw "Missing ONNX Runtime native library: $onnxRuntime" }
          $turkishTts = Resolve-Path ./dist/App/Tools/TurkishTts/scenarioforge-turkish-tts.exe -ErrorAction Stop
          $requiredVoices = @('af_heart.npy', 'af_sarah.npy', 'am_michael.npy', 'bf_emma.npy', 'bf_isabella.npy', 'bm_george.npy', 'bm_fable.npy')
          $voiceFiles = @(Get-ChildItem ./dist/App/voices -Filter '*.npy' -File -Recurse)
          $missingVoices = @($requiredVoices | Where-Object { $_ -notin $voiceFiles.Name })
          if ($missingVoices.Count -gt 0) { throw "Missing Kokoro voices: $($missingVoices -join ', ')" }
          Write-Host "Turkish speech helper: $turkishTts"
          Write-Host "Kokoro voices verified: $($voiceFiles.Count)"
          Write-Host "Application: $app"
          Write-Host ("Application size: {0:N1} MB" -f ((Get-Item $app).Length / 1MB))
          Write-Host "Installer: $($installer.FullName)"
          Write-Host ("Installer size: {0:N1} MB" -f ($installer.Length / 1MB))
          Write-Host "Native Vulkan and ONNX dependencies verified."

      - name: Read application version
        id: version
        shell: pwsh
        working-directory: source
        run: |
          [xml]$project = Get-Content ./src/ScenarioForge/ScenarioForge.csproj
          $appVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($appVersion)) { throw "Application version is missing." }
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Scenario Forge version: $appVersion"

      - name: Create SHA-256 update manifest
        if: steps.source.outputs.publish_release == 'true'
        shell: pwsh
        working-directory: source
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:APP_VERSION
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "The application has an invalid release version: $version"
          }

          $installerPath = Join-Path (Resolve-Path ./dist/Installer).Path "ScenarioForge-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "The expected Setup.exe was not found: $installerPath"
          }

          $updateVersion = $version
          if ($version -match '^\d+\.\d+\.\d+$') {
            $updateVersion = "$version.0"
          }

          $sha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $tag = "v$version"
          $manifest = [ordered]@{
            schemaVersion = 1
            appId = 'ScenarioForge'
            version = $updateVersion
            minimumUpdaterVersion = '0.5.6.32'
            setupUrl = "https://github.com/Luncor/ScenarioForge-Updates/releases/download/$tag/ScenarioForge-Setup-$version.exe"
            sha256 = $sha256
            releaseNotes = "Scenario Forge $version update"
          }

          $manifestPath = Join-Path (Split-Path -Parent $installerPath) 'latest.json'
          $manifest | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          Write-Host "Update manifest:"
          Get-Content -LiteralPath $manifestPath

      - name: Publish public update release
        if: steps.source.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_version }}
          name: Scenario Forge v${{ steps.version.outputs.app_version }}
          target_commitish: main
          body: "Automated Windows x64 release for Scenario Forge."
          files: |
            source/dist/Installer/ScenarioForge-Setup-${{ steps.version.outputs.app_version }}.exe
            source/dist/Installer/latest.json
          token: ${{ github.token }}
          make_latest: true
          fail_on_unmatched_files: true
